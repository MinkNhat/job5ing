<header class="site-header admin-header">
    <div class="container site-header-inner">
        <a class="site-logo" href="{{ url_for('admin_panel.index') }}">
            <span class="site-logo-mark">
                <img src="{{ url_for('static', filename='images/Logo_removebg.png') }}" alt="Job5ing logo">
            </span>
            <span class="site-logo-text ms-2 fw-bold" style="color: #ff9550;"></span>
        </a>

        <nav class="site-nav">
            <a class="site-nav-link {% if request.endpoint == 'admin_panel.index' %}active{% endif %}" href="{{ url_for('admin_panel.index') }}">Tổng quan</a>
            <a class="site-nav-link {% if request.endpoint == 'admin_panel.accounts' %}active{% endif %}" href="{{ url_for('admin_panel.accounts') }}">Tài khoản</a>
            <a class="site-nav-link {% if request.endpoint == 'admin_panel.posts' %}active{% endif %}" href="{{ url_for('admin_panel.posts') }}">Tin tuyển dụng</a>
            <a class="site-nav-link {% if request.endpoint == 'admin_panel.companies' %}active{% endif %}" href="{{ url_for('admin_panel.companies') }}">Công ty</a>
        </nav>

        <div class="dropdown site-user-menu">
            <a class="site-user-trigger text-decoration-none dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                <span class="site-user-avatar me-2">
                    {% if current_admin and current_admin.avatar_url %}
                        <img src="{{ current_admin.avatar_url }}" alt="Admin Avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                    {% else %}
                        <img src="{{ url_for('static', filename='images/admin.png') }}" alt="Default Admin Avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                    {% endif %}
                </span>
                <span class="site-user-meta">
                    {{ ((current_admin.last_name or '') ~ ' ' ~ (current_admin.first_name or '')).strip() if current_admin else 'Hi Admin' }}
                </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" href="{{ url_for('admin_panel.profile') }}">Hồ sơ cá nhân</a></li>
                <li><a class="dropdown-item" href="{{ url_for('admin_panel.accounts', role='admin') }}">Tài khoản quản trị</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{{ url_for('main.logout') }}">
                        <button type="submit" class="dropdown-item text-danger">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

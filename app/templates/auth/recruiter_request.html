{% extends 'base_public.html' %}

{% block title %}Job5ing | Kết nối Công ty{% endblock %}

{% block content %}
<div class="container py-4">
    <!-- BREADCRUMB -->
    <nav aria-label="breadcrumb" class="breadcrumb-container">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">Trang chủ</a></li>
            <li class="breadcrumb-item active">Kết nối Công ty</li>
        </ol>
    </nav>
    <section class="auth-centered-section" style="min-height: calc(100vh - 300px); display: flex; align-items: center;">
    <div class="container">
        <div class="auth-centered-shell">
            <div class="auth-centered-card" style="width: 45%;">
                <div class="auth-centered-title">Xác nhận Công ty trực thuộc</div>

                <form class="auth-centered-form" method="POST" action="{{ url_for('main.submit_join_request') }}">
                    <div class="form-group">
                        <label>Chọn công ty trực thuộc <span class="text-danger">*</span></label>
                        <select name="company_id" class="form-control" required style="cursor: pointer;">
                            <option value="" disabled selected>Tìm và chọn công ty</option>
                            {% for company in companies %}
                                <option value="{{ company.id }}">{{ company.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nhập chức vụ của bạn <span class="text-danger">*</span></label>
                        <input type="text" name="position" class="form-control" placeholder="VD: Trưởng phòng nhân sự" required>
                    </div>

                    <button type="submit" class="auth-centered-submit" style="margin-top: 10px;">
                        Gửi yêu cầu gia nhập
                    </button>
                </form>

                <div class="auth-centered-divider">
                    <span>HOẶC</span>
                </div>

                <div style="text-align: center;">
                    <button type="button" id="openModalBtn" class="site-action-btn" style="width: 100%; border: 1px solid #c5d7ea;">
                        Đăng ký Công ty mới
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<div id="newCompanyModal" class="custom-modal-overlay hidden">
    <div class="custom-modal-content">
        <div class="modal-header">
            <h3>Đăng ký hồ sơ Công ty</h3>
            <button class="close-modal-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <div class="modal-body">
            <form id="newCompanyForm" method="POST" action="{{ url_for('main.register_company') }}" enctype="multipart/form-data">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Tên công ty <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="VD: Công ty CP Job5ing" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Mã số thuế <span class="text-danger">*</span></label>
                        <input type="text" name="taxCode" id="taxCodeInput" class="form-control" placeholder="Mã số thuế doanh nghiệp" required>
                        <div id="taxCodeError" style="color: #ef4437; font-size: 0.8rem; margin-top: 5px; display: none;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Chức vụ của bạn <span class="text-danger">*</span></label>
                    <input type="text" name="position" class="form-control" placeholder="VD: Giám đốc điều hành" required>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Tỉnh/Thành phố <span class="text-danger">*</span></label>
                        <select name="city" class="form-control" required>
                            <option value="" disabled selected>Chọn tỉnh/thành phố</option>
                            {% for loc in locations %}
                                <option value="{{ loc }}">{{ loc }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Địa chỉ chi tiết</label>
                        <input type="text" name="address" class="form-control" placeholder="Số nhà, tên đường, phường/xã...">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Trang web</label>
                        <input type="url" name="website" class="form-control" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Ngày thành lập</label>
                        <input type="date" name="establishDate" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Quy mô nhân sự</label>
                    <select name="scale" class="form-control">
                        {% for option in scale_options %}
                            <option value="{{ option }}">{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-grid-2 upload-area">
                    <div class="form-group">
                        <label>Logo công ty (Ảnh)</label>
                        <input type="file" name="avatar" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Giấy phép kinh doanh <span class="text-danger">*</span></label>
                        <input type="file" name="businessLicense" class="form-control" accept=".pdf, image/*" required>
                        <small style="color: var(--site-subtle); font-size: 0.8rem;">Dùng để xác thực (Không hiển thị công khai)</small>
                    </div>
                </div>

            </form>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">Hủy bỏ</button>
            <button type="submit" form="newCompanyForm" class="auth-centered-submit" style="padding: 10px 24px;">Gửi Đăng ký</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const modal = document.getElementById("newCompanyModal");
        const openBtn = document.getElementById("openModalBtn");
        const closeBtn = document.getElementById("closeModalBtn");
        const cancelBtn = document.getElementById("cancelModalBtn");
        
        const taxInput = document.getElementById("taxCodeInput");
        const taxError = document.getElementById("taxCodeError");
        const submitBtn = document.querySelector('button[form="newCompanyForm"]');

        function validateVNMST(mst) {
            mst = mst.trim().replace(/-/g, "");
            if (!mst) return { valid: false, msg: "" };
            if (!/^\d{10}$|^\d{13}$/.test(mst)) {
                return { valid: false, msg: "Mã số thuế phải có 10 hoặc 13 chữ số." };
            }

            const weights = [31, 29, 23, 19, 17, 13, 7, 5, 3];
            let sum = 0;
            for (let i = 0; i < 9; i++) {
                sum += parseInt(mst[i]) * weights[i];
            }

            const remainder = sum % 11;
            const checkDigit = 10 - remainder;

            if (checkDigit !== parseInt(mst[9])) {
                return { valid: false, msg: "Mã số thuế không hợp lệ (sai số kiểm tra)." };
            }

            return { valid: true, msg: "" };
        }

        taxInput.addEventListener("input", function() {
            const result = validateVNMST(this.value);
            if (this.value.trim() === "") {
                taxError.style.display = "none";
                this.style.borderColor = "rgba(28, 48, 78, 0.14)";
                submitBtn.disabled = false;
            } else if (!result.valid) {
                taxError.textContent = result.msg;
                taxError.style.display = "block";
                this.style.borderColor = "#ef4437";
                submitBtn.disabled = true;
                submitBtn.style.opacity = "0.6";
            } else {
                taxError.style.display = "none";
                this.style.borderColor = "#10b981";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        });

        // Chặn submit form nếu MST không hợp lệ
        const companyForm = document.getElementById("newCompanyForm");
        companyForm.addEventListener("submit", function(e) {
            const result = validateVNMST(taxInput.value);
            if (!result.valid) {
                e.preventDefault();
                taxError.textContent = result.msg || "Vui lòng nhập mã số thuế hợp lệ trước khi gửi.";
                taxError.style.display = "block";
                taxInput.focus();
            }
        });

        // Mở Modal
        openBtn.addEventListener("click", function() {
            modal.classList.remove("hidden");
            document.body.style.overflow = "hidden"; // Chặn scroll web khi mở modal
        });

        // Đóng Modal (Dùng chung cho nút X và nút Hủy)
        function closeModal() {
            modal.classList.add("hidden");
            document.body.style.overflow = "auto"; // Mở lại scroll
        }

        closeBtn.addEventListener("click", closeModal);
        cancelBtn.addEventListener("click", closeModal);

        // Đóng khi click ra ngoài vùng modal
        window.addEventListener("click", function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
    });
</script>
{% endblock %}
